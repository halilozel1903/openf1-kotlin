      <rect x="10" y="10" width="10" height="10" fill="#FFFFFF"/>
    </pattern>
    <clipPath id="phoneScreen"><rect x="842" y="128" width="236" height="452" rx="26"/></clipPath>
    <clipPath id="tabletScreen"><rect x="682" y="84" width="420" height="300" rx="16"/></clipPath>
